<!doctype html>
<meta charset="utf-8">
<title>magpie</title>
<link rel="stylesheet" href="popup.css">

<div class="topbar">
<header class="bar">
  <span class="brand">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <defs><clipPath id="tile"><rect x="0" y="0" width="32" height="32" rx="7.4"/></clipPath></defs>
      <g clip-path="url(#tile)">
        <rect width="32" height="32" fill="var(--mark-ground)"/>
        <circle cx="6.4" cy="30.4" r="16" fill="var(--mark-swell)"/>
        <circle cx="21.8" cy="10.2" r="4.6" fill="var(--mark-dot)"/>
      </g>
    </svg>
    <span class="wordmark">magpie</span>
  </span>

  <span class="head-actions">
  <button class="icon-button" id="open-history" title="What you have remembered" aria-label="History">
    <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <path d="M2 4h12M2 8h12M2 12h7"/>
    </svg>
    <span class="pip" id="history-pip" hidden></span>
  </button>
  <button class="destination" id="destination" title="Settings">
    <span class="back-arrow" aria-hidden="true">&#8249;</span>
    <span id="destination-text">Not set up</span>
  </button>
  </span>
</header>

<div class="rail" id="rail" hidden><div class="rail-fill" id="rail-fill"></div></div>
</div>

<main id="view-main">
  <div class="subject">
    <div class="subject-title" id="page-title">&hellip;</div>
    <div class="subject-host" id="page-url"></div>
  </div>

  <section id="state-idle" class="state">
    <button class="primary" id="remember">
      <span>Remember this page</span>
      <kbd id="shortcut-hint">Alt Shift M</kbd>
    </button>
    <button class="ghost" id="compose-open">Add a note first</button>
    <p class="footnote" id="already" hidden></p>
    <p class="footnote" id="idle-hint"></p>
  </section>

  <section id="state-working" class="state" hidden>
    <div class="status working">
      <span class="dot" aria-hidden="true"></span>
      <span class="status-text" id="stage-name">Working</span>
      <span class="status-meta" id="stage-count"></span>
    </div>
    <p class="footnote">Close this whenever you like. It keeps going.</p>
  </section>

  <section id="state-queued" class="state" hidden>
    <div class="status warn">
      <span class="tick" aria-hidden="true">&#8635;</span>
      <span class="status-text">Saved on this device</span>
    </div>
    <p class="detail" id="queued-detail"></p>
    <button class="ghost" id="queued-history">See what is waiting</button>
  </section>

  <section id="state-done" class="state" hidden>
    <div class="status good">
      <span class="tick" aria-hidden="true">&#10003;</span>
      <span class="status-text" id="receipt-title">Remembered</span>
    </div>
    <p class="detail" id="receipt-detail"></p>
    <blockquote class="summary" id="receipt-summary" hidden></blockquote>
    <button class="ghost" id="again">Remember again</button>
  </section>

  <section id="state-error" class="state" hidden>
    <div class="status bad">
      <span class="tick" aria-hidden="true">&#33;</span>
      <span class="status-text" id="error-title">Could not remember this</span>
    </div>
    <p class="detail" id="error-detail"></p>
    <button class="primary" id="recover" hidden></button>
    <button class="ghost" id="retry">Try again</button>
  </section>
</main>

<main id="view-settings" hidden>
  <section class="group">
    <h2>What leaves this machine</h2>
    <div class="segmented" role="radiogroup" aria-label="What leaves this machine">
      <input type="radio" name="mode" id="mode-distill" value="distill">
      <label for="mode-distill">A summary</label>
      <input type="radio" name="mode" id="mode-raw" value="raw">
      <label for="mode-raw">The page text</label>
    </div>
    <p class="footnote" id="mode-note"></p>

    <label class="field" id="model-field">
      <span class="field-label">Local model</span>
      <select id="model-size"></select>
      <small class="field-note" id="model-note"></small>
    </label>
  </section>

  <section class="group">
    <h2>Where it goes</h2>
    <label class="field">
      <span class="field-label">Memory layer</span>
      <select id="provider"></select>
    </label>
    <div id="provider-fields"></div>
  </section>

  <section class="group">
    <h2>On the page</h2>
    <label class="switch">
      <input type="checkbox" id="inpage">
      <span class="switch-body">
        <b>Show a magpie button on pages</b>
        <small id="inpage-note"></small>
      </span>
    </label>
  </section>

  <button class="primary" id="save"><span>Save</span></button>
  <button class="ghost" id="close-settings">Back</button>
  <p class="footnote" id="save-note"></p>
</main>

<main id="view-compose" hidden>
  <div class="subject">
    <div class="subject-title" id="compose-title">&hellip;</div>
    <div class="subject-host" id="compose-host"></div>
  </div>

  <label class="field">
    <span class="field-label">Your note</span>
    <textarea id="compose-note" rows="3" placeholder="Why is this worth keeping?"></textarea>
  </label>

  <label class="field">
    <span class="field-label" id="compose-body-label">Summary</span>
    <textarea id="compose-body" rows="8"></textarea>
    <small class="field-note" id="compose-body-note"></small>
  </label>

  <button class="primary" id="compose-save"><span>Remember it</span></button>
  <button class="ghost" id="compose-cancel">Cancel</button>
</main>

<main id="view-history" hidden>
  <div id="history-empty" class="empty" hidden>
    <p>Nothing remembered yet. Press <kbd>Alt</kbd> <kbd>Shift</kbd> <kbd>M</kbd> on a page worth keeping.</p>
  </div>
  <div id="history-list"></div>
</main>

<script src="popup.js" type="module"></script>
