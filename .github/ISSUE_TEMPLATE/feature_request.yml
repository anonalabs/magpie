name: Feature request
description: Suggest something magpie should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation, not the solution. What were you doing when magpie got in the way?
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What you had in mind
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
