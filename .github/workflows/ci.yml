name: CI

on:
  push:
    branches: [main]
  pull_request:

# The build writes dist/, which nothing else reads here, so jobs stay independent.
jobs:
  test:
    name: unit, build, and the remote-code gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Only the root install: the daemon's own dependencies are an inference
      # runtime, and none of the tests need it. Asserted by running the suite
      # with local/node_modules removed.
      - run: npm ci

      - name: build the extension
        run: npm run build

      - name: no remotely-hosted code in the bundle
        run: npm run check:remote

      - name: unit tests, extension and daemon
        run: npm test

  e2e:
    name: end to end, in a real Chrome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

      # Chrome for Testing, pinned, rather than whatever the runner image ships.
      #
      # The runner's own Chrome would not load an unpacked extension at all: no
      # service worker, and not a word on stderr about why. That is an
      # uncontrolled variable in the one suite whose whole job is to be the
      # thing that runs a real browser, and a version anybody can reproduce
      # beats a version that happens to be installed. Downloaded with curl so
      # no third-party action joins the supply chain of a project whose point
      # is that it does not fetch code it has not vendored.
      - name: Chrome for Testing
        run: |
          version="153.0.8010.52"
          url="https://storage.googleapis.com/chrome-for-testing-public/${version}/linux64/chrome-linux64.zip"
          curl -fsSL -o /tmp/chrome.zip "$url"
          unzip -q /tmp/chrome.zip -d /tmp/chrome
          /tmp/chrome/chrome-linux64/chrome --version

      - name: end to end
        run: npm run test:e2e
        env:
          CHROME_PATH: /tmp/chrome/chrome-linux64/chrome
