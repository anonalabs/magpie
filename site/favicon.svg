<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The same mark the extension shows in its toolbar and its popup: dark
       ground, the white belly, one red eye. Dark-grounded on purpose, so it
       reads on a light tab strip and on a dark one. -->
  <defs><clipPath id="r"><rect width="32" height="32" rx="7.4"/></clipPath></defs>
  <g clip-path="url(#r)">
    <rect width="32" height="32" fill="#1a1816"/>
    <circle cx="6.4" cy="30.4" r="16" fill="#ffffff"/>
    <circle cx="21.8" cy="10.2" r="4.6" fill="#e7413c"/>
  </g>
</svg>
